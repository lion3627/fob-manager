      FIG.forEach(([role, side, armed, name], i) => {
        const x = 90 + i * 150, y = 250;
        drawHot({ role, side, armed, hp: 'ok', posture: 'stand', face: 0, gait: 0.7, moving: true, state: 'idle', peekUntil: 0 }, x, y, 30, 0);
        text(name, x, y + 40, 15, '#fff');
      });
      const extra = [[{ role: 'fighter', side: 'red', armed: true, hp: 'ok', posture: 'prone', face: 0, state: 'idle' }, 'Fighter, prone'], [{ role: 'man', side: 'civ', hp: 'ok', posture: 'prone', face: 0, state: 'sleep' }, 'Sleeper, blanket'],
        [{ role: 'man', side: 'civ', hp: 'ok', posture: 'stand', face: 0, surr: true, state: 'surrender' }, 'Hands up'], [{ role: 'man', side: 'civ', hp: 'ok', posture: 'sit', detained: true, face: 0, state: 'detained' }, 'Detained, seated'],
        [{ role: 'soldier', side: 'blue', hp: 'kia', posture: 'prone', face: 0, deathT: 0, state: 'idle' }, 'Casualty'], [{ role: 'truck', side: 'blue', face: 0 }, 'Truck']];
      extra.forEach(([a, name], i) => { const x = 110 + i * 200, y = 470; drawHot(Object.assign({ gait: 0, moving: false, peekUntil: 0 }, a), x, y, a.role === 'truck' ? 14 : 30, 0); text(name, x, y + 55, 15, '#fff'); });
    },
  },
  title: {
    update() { if (pressed('Enter') || pressed('Space')) { reset(); scene = 'play'; } },
    draw() {
      clear('#060906');
      text(TITLE, 80, 80, 56, '#cfe8cf', 'left', true);
      text('One night raid, from the command post.', 82, 128, 20, '#8fb08f', 'left');
      const brief = [
        ['TIP  0140L', '#ffcf5a'], ['A local source says Qari ZAHID, the cell leader, is sleeping tonight at the', '#ddd'],
        ['compound of Haji Wali (OBJ RAVEN). Source reliability C, information unconfirmed.', '#ddd'],
        ['ZAHID: forties, walks with a limp in his left leg. Biometrics on file.', '#ddd'], ['', '#ddd'],
        ['YOU  company commander in the CP', '#ffcf5a'], ['The ground force commander runs the raid with three squads and a reserve.', '#ddd'],
        ['He asks you at each gate: GO, WAIT, or ABORT. You see only what the drone\'s', '#ddd'],
        ['thermal camera and the helmet cams show, and what he reports on the radio.', '#ddd'],
        ['The drone cannot see under roofs. Waiting costs time; ZAHID will not stay all night.', '#ddd'],
      ];
      brief.forEach(([t, c], i) => text(t, 82, 190 + i * 26, 18, c, 'left'));
      CONTROLS.forEach((c, i) => text(c, 82, 480 + i * 28, 17, '#9fdc9f', 'left'));
      text('Enter to begin infil', 82, 640, 24, '#fff', 'left', true);
    },
  },
  play: {
    update(dt) {
      const s = state;
      if (pressed('KeyP') || pressed('Escape')) { scene = 'pause'; return; }
      if (pressed('Space')) s.paused = !s.paused;
      if (pressed('KeyT')) s.fast = !s.fast;
      for (let i = 1; i <= 4; i++) if (pressed('Digit' + i) || pressed('Numpad' + i)) s.main = i - 1;
      if (pressed('KeyB')) s.showBft = s.showBft === false;
      if (pressed('KeyG')) cmdGo(); if (pressed('KeyW')) cmdWait(); if (pressed('KeyX')) cmdAbort();
      if (pressed('KeyR')) cmdReserve(); if (pressed('KeyI')) cmdIntercept();
      if (pressed('Tab')) { const vis = persons().filter(a => a.side !== 'blue' && droneSees(a) && a.role !== 'dog' && !a.detained && a.hp === 'ok'); if (vis.length) { const i = vis.findIndex(a => a.id === s.view.track); s.view.track = vis[(i + 1) % vis.length].id; s.main = 0; } }
      if (pressed('Equal') || pressed('NumpadAdd')) s.view.z = clamp(s.view.z * 1.25, 1.5, 20);
      if (pressed('Minus') || pressed('NumpadSubtract')) s.view.z = clamp(s.view.z / 1.25, 1.5, 20);
      let px = 0, py = 0; if (down.has('ArrowLeft')) px -= 1; if (down.has('ArrowRight')) px += 1; if (down.has('ArrowUp')) py -= 1; if (down.has('ArrowDown')) py += 1;
      if (px || py) { const X = droneXf(...MAIN), v = 500 * dt; pan(X, -px * v, -py * v); }
      if (s.paused) return;
      const n = s.fast ? tune.timeFast : 1;
      for (let i = 0; i < n && scene === 'play'; i++) sim(dt);
    },
    draw() { drawCP(); },
  },
  pause: {
    update() { if (pressed('KeyP') || pressed('Escape')) scene = 'play'; },
    draw() { drawCP(); ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(0, 0, W, H); text('Paused', W / 2, H / 2, 48, '#fff'); },
  },
  results: {
    update() { if (pressed('Enter')) { runSeed++; reset(); scene = 'play'; } },
    draw() {
      drawCP(); const s = state, r = s.result || { tgt: '', truth: '' }, st = s.stats;
      ctx.fillStyle = 'rgba(0,8,0,0.88)'; ctx.fillRect(200, 110, 880, 470); ctx.strokeStyle = '#9fdc9f'; ctx.strokeRect(200.5, 110.5, 879, 469);
      text('AFTER ACTION', 640, 150, 30, '#cfe8cf', 'center', true);
      text(r.tgt, 640, 200, 24, s.gained === 'JACKPOT' ? '#7ee07e' : '#ffcf5a', 'center', true);
      text(`What was really there: ${r.truth}`, 640, 240, 17, '#ddd');
      const rows = [['Friendly', `${st.fkia} KIA, ${st.fwia} WIA`], ['Civilians', `${st.ckia} killed, ${st.cwia} wounded`], ['Enemy', `${st.ekia} killed, ${st.ewia} wounded`],
        ['Detained', `${s.stats.det}`], ['Time on the ground', `${Math.floor(s.t / 60)} min ${Math.floor(s.t % 60)} s, back at the drop-off ${fmtClock(s.t)}`]];
      rows.forEach(([a, b], i) => { text(a, 440, 300 + i * 34, 19, '#9fdc9f', 'right'); text(b, 470, 300 + i * 34, 19, '#fff', 'left'); });
      text('Enter: another night (a new tip, a new truth)', 640, 540, 20, '#fff', 'center', true);
    },
  },
};

// ---- Pointer: slew, zoom, track, click panels and buttons --------------------------------------------
let drag = null;
const lp = e => { const r = canvas.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H]; };
const inR = (x, y, r) => x >= r[0] && x < r[0] + r[2] && y >= r[1] && y < r[1] + r[3];
function pan(X, dx, dy) { const v = state.view; v.cx -= (dx * X.c + dy * X.n) / X.s; v.cy -= (-dx * X.n + dy * X.c) / X.s; v.cx = clamp(v.cx, 0, MW); v.cy = clamp(v.cy, 0, MH); v.track = null; }
canvas.addEventListener('pointerdown', e => {
  startAudio(); const [x, y] = lp(e);
  if (scene === 'title' || scene === 'results') { hit.add('Enter'); return; }
  if (scene !== 'play') return;
  const b = BTN.find(b => inR(x, y, [b.x, b.y, b.w, b.h])); if (b) { hit.add(b.code); return; }
  const si = SIDE.findIndex(r => inR(x, y, r)); if (si >= 0) { state.main = sideFeeds()[si]; return; }
  if (inR(x, y, MAIN) && state.main === 0) { drag = { x, y, sx: x, sy: y, moved: false }; canvas.setPointerCapture(e.pointerId); }
});
canvas.addEventListener('pointermove', e => {
  if (!drag) return; const [x, y] = lp(e);
  if (Math.hypot(x - drag.sx, y - drag.sy) > 5) drag.moved = true;
  if (drag.moved) pan(droneXf(...MAIN), x - drag.x, y - drag.y);
  drag.x = x; drag.y = y;
});
canvas.addEventListener('pointerup', () => {
  if (drag && !drag.moved) {
    const s = state, X = droneXf(...MAIN), [wx, wy] = s2w(X, drag.sx, drag.sy);
    if (s.placing) placeReserve(wx, wy);
    else {
      let best = null, bd = Math.max(3, 14 / X.s);
      for (const a of s.actors) if (droneSees(a)) { const d = Math.hypot(a.x - wx, a.y - (wy + 0.8)); if (d < bd) { bd = d; best = a; } }
      s.view.track = best ? best.id : null; if (best) events.push({ kind: 'track', id: best.id });
    }
  }
  drag = null;
});
canvas.addEventListener('wheel', e => { if (scene !== 'play' || state.main !== 0) return; e.preventDefault(); state.view.z = clamp(state.view.z * Math.exp(-e.deltaY * 0.0015), 1.5, 20); }, { passive: false });

// ---- Loop -------------------------------------------------------------------------------------------
function step() {
  if (pressed('KeyM')) { setMuted(!muted); hit.delete('KeyM'); }
  if (scene === 'play' || scene === 'results' || scene === 'pause') state.frame = (state.frame || 0) + (scene === 'play' ? 0 : 1);
  scenes[scene].update(STEP); hit.clear();
}
let last, acc = 0, ALPHA = 1;
function tick() {
  const now = clock.now();
  acc += Math.min(now - last, 0.25); last = now;
  while (acc >= STEP) { step(); acc -= STEP; }
  ALPHA = acc / STEP;
  drawFrame();
}
function drawFrame() { scenes[scene].draw(); }
function frame() { tick(); requestAnimationFrame(frame); }
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }

window.game = {
  get scene() { return scene; },
  get state() { return state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; },
  step(n = 1, draw = true, alpha = 1) {
    for (let i = 0; i < n; i++) step();
    if (draw) { ALPHA = alpha; drawFrame(); }
  },
};

reset();
scene = params.get('scene') || 'title';
last = clock.now();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
</script>
