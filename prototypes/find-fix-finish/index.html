<div id="stage"><canvas id="game"></canvas><div id="panel"></div><div id="form"></div></div>
<script src="config.js"></script>
<script>
'use strict';
// The one-shot's starter: only what the checks read. Keep the fixed step, the clock hook,
// window.game and the play and figures scenes. Everything else is the game's own: replace
// what is marked "the game", and draw every figure in the brief's look, in 2D or with three.js.

// ---- Built to be checked ----------------------------------------------------------------
const params = new URLSearchParams(location.search);
const tune = new Proxy({}, { get: (_, k) => CONFIG[k].value }); // live: tune.speed is CONFIG.speed.value
const STEP = 1 / 60;            // simulation step in seconds; motion is per second, never per frame
const W = 1280, H = 720;        // logical size; a pixel look lowers it and sets PIXEL
const PIXEL = false;            // pixel looks: whole-number scale, no smoothing
const FONT = "'Segoe UI', Roboto, Helvetica, Arial, sans-serif";      // the brief's look picks the type
const TITLE = 'Find, Fix, Finish';
const CONTROLS = ['Mouse: click compounds, drag to pan, wheel to zoom', 'N: task a platoon · Space: pause · 1-4: time speed', 'Arrows: pan · M: mute']; // shown on the title screen
const clock = window.GAME_CLOCK || { now: () => performance.now() / 1000 }; // a check may inject one
const CHEAP = params.get('render') === 'cheap'; // a headless shot or check: 3D draws cheap; players never see it
let seed;
function rng() { // mulberry32; every gameplay random call reads this, never Math.random
  seed = (seed + 0x6D2B79F5) | 0;
  let t = Math.imul(seed ^ (seed >>> 15), seed | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const events = []; // window.game.events: anything the game wants a run to see

// ---- Screen ---------------------------------------------------------------------------
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const stage = document.getElementById('stage');
let VIEWK = 1;
function fit() { // fills the window at any size and pixel ratio; the DOM panels scale with the canvas
  const k = Math.min(innerWidth / W, innerHeight / H);
  const r = k * (devicePixelRatio || 1);
  VIEWK = k;
  canvas.width = Math.round(W * r); canvas.height = Math.round(H * r);
  stage.style.transform = `scale(${k})`;
  stage.style.left = Math.max(0, Math.floor((innerWidth - W * k) / 2)) + 'px';
  stage.style.top = Math.max(0, Math.floor((innerHeight - H * k) / 2)) + 'px';
  ctx.setTransform(r, 0, 0, r, 0, 0); ctx.imageSmoothingEnabled = true;
}
addEventListener('resize', fit); fit();
function clear(c) { ctx.fillStyle = c; ctx.fillRect(0, 0, W, H); }
function text(s, x, y, size, c, align = 'center', font = FONT) {
  ctx.fillStyle = c; ctx.font = `${size}px ${font}`; ctx.textAlign = align;
  ctx.textBaseline = 'middle'; ctx.fillText(s, x, y);
}

// ---- Input: keys by position (event.code), OS key repeat ignored ------------------------
const down = new Set(), hit = new Set();
const pressed = code => hit.has(code); // true for one step after the key goes down
addEventListener('keydown', e => {
  startAudio();
  if (e.target && (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT')) return;
  if (!e.repeat) { down.add(e.code); hit.add(e.code); }
  if (e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault();
});
addEventListener('keyup', e => down.delete(e.code));
addEventListener('pointerdown', () => startAudio());
addEventListener('blur', () => down.clear());

// ---- Audio: started on first input, mute on M --------------------------------------------
let audio = null, muted = false;
function startAudio() {
  if (!audio) {
    const ac = window.GAME_AUDIO || new (window.AudioContext || window.webkitAudioContext)(); // a check may inject one
    const out = ac.createGain(); out.gain.value = muted ? 0 : tune.volume;
    out.connect(ac.destination); audio = { ac, out };
  }
  if (audio.ac.state === 'suspended') audio.ac.resume();
}
function setMuted(m) { muted = m; if (audio) audio.out.gain.value = m ? 0 : tune.volume; }
addEventListener('tune', () => setMuted(muted));
function tone(freq, dur, type = 'square', vol = 0.3) {
  if (!audio || muted) return;
  const t = audio.ac.currentTime, o = audio.ac.createOscillator(), g = audio.ac.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(audio.out); o.start(t); o.stop(t + dur);
}
function radioBlip() { tone(1150, 0.05, 'square', 0.08); setTimeout(() => tone(900, 0.06, 'square', 0.06), 70); }
function alarm() { tone(660, 0.18, 'sawtooth', 0.12); setTimeout(() => tone(520, 0.25, 'sawtooth', 0.1), 200); }

// =========================================================================================
// THE WORLD (truth). The command post never reads this directly: it reads st.hq.
// =========================================================================================
const MAPW = 820;
const COP = { x: 520, y: 1560 };
const VCTR = { x: 2650, y: 1450 };
const MOSQUE = { x: 2610, y: 1390 };
const EXIT = { x: 4000, y: 1610 };
const ROADLINE = [{ x: 0, y: 1585 }, { x: 520, y: 1580 }, { x: 1200, y: 1545 }, { x: 1900, y: 1505 }, { x: 2400, y: 1485 }, { x: 2900, y: 1505 }, { x: 3400, y: 1560 }, { x: 4000, y: 1610 }];
const WADI = [{ x: 1600, y: 0 }, { x: 1700, y: 500 }, { x: 1850, y: 900 }, { x: 2030, y: 1230 }, { x: 2140, y: 1700 }, { x: 2050, y: 2200 }, { x: 1900, y: 3000 }];
const HILL = { x: 2750, y: 560, rx: 720, ry: 260, name: 'Hill 1240' };
const HILLPOST = { x: 2560, y: 820 };
const ROUTES = {
  ROAD: { name: 'the main road', pts: [{ x: 600, y: 1578 }, { x: 1200, y: 1545 }, { x: 1900, y: 1505 }, { x: 2260, y: 1490 }] },
  NORTH: { name: 'the northern track and the wadi', pts: [{ x: 560, y: 1480 }, { x: 720, y: 1080 }, { x: 1450, y: 760 }, { x: 1780, y: 760 }, { x: 1880, y: 950 }, { x: 2040, y: 1250 }, { x: 2280, y: 1330 }] },
  SOUTH: { name: 'the southern fields', pts: [{ x: 600, y: 1650 }, { x: 820, y: 1960 }, { x: 1550, y: 2120 }, { x: 2120, y: 1930 }, { x: 2330, y: 1690 }] },
};
const NAMES = ['Karim', 'Nadir', 'Wahid', 'Rahim', 'Jalal', 'Habib', 'Faizal', 'Sharif', 'Qasim', 'Latif', 'Bashir', 'Hamid', 'Zarif', 'Akbar', 'Daud', 'Naim', 'Samad', 'Wali', 'Yusuf', 'Rauf', 'Saber', 'Tahir', 'Zaman', 'Anwar', 'Farid', 'Ghafoor', 'Haroon', 'Ismail', 'Jamil', 'Khalil', 'Mansur', 'Nasrullah', 'Obaid', 'Rashid', 'Salim', 'Tariq', 'Usman', 'Waheed', 'Zubair', 'Aziz', 'Bilal', 'Dost', 'Fazal', 'Hakim', 'Idris', 'Javed', 'Kabir', 'Lal', 'Mirwais', 'Navid'];
const SURN = ['Reyes', 'Okafor', 'Brandt', 'Nguyen', 'Kowalski', 'Harris', 'Delgado', 'Price', 'Moreno', 'Fischer', 'Baker', 'Coleman', 'Diaz', 'Evans', 'Foster', 'Grant', 'Hughes', 'Ibarra', 'Jensen', 'Kim', 'Lopez', 'Mason', 'Novak', 'Ortiz', 'Patel', 'Quinn', 'Ruiz', 'Shaw', 'Torres', 'Underwood', 'Vance', 'Walsh', 'Young', 'Zimmer', 'Abbott', 'Bishop', 'Carter', 'Dunn', 'Ellis', 'Ford', 'Garcia', 'Hale', 'Irwin', 'Jordan', 'Keller', 'Lane', 'Murphy', 'Nash', 'Owens', 'Perry'];
const RANKS = ['PVT', 'PFC', 'PFC', 'SPC', 'SPC', 'SPC', 'SGT', 'SGT', 'SSG'];

const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pick = arr => arr[Math.floor(rng() * arr.length)];
function segDist(p, a, b) { const dx = b.x - a.x, dy = b.y - a.y, l = dx * dx + dy * dy; let t = l ? ((p.x - a.x) * dx + (p.y - a.y) * dy) / l : 0; t = clamp(t, 0, 1); return Math.hypot(a.x + dx * t - p.x, a.y + dy * t - p.y); }
function lineDist(p, pts) { let d = 1e9; for (let i = 1; i < pts.length; i++) d = Math.min(d, segDist(p, pts[i - 1], pts[i])); return d; }
function lerpTo(p, q, d) { const L = dist(p, q); if (L <= d) return { x: q.x, y: q.y, arrived: true }; return { x: p.x + (q.x - p.x) * d / L, y: p.y + (q.y - p.y) * d / L, arrived: false }; }

// Time: st.t is game minutes since 1800 on day 1.
const mod = t => (1080 + t) % 1440;
const dayOf = t => 1 + Math.floor((1080 + t) / 1440);
const hhmm = t => { const m = mod(Math.floor(t)); return String(Math.floor(m / 60)).padStart(2, '0') + String(m % 60).padStart(2, '0'); };
const dtg = t => `D${dayOf(Math.floor(t))} ${hhmm(t)}`;
const isNight = t => { const m = mod(t); return m < 330 || m >= 1140; };
function nextAt(t, m) { let d = (m - mod(t) + 1440) % 1440; return t + d; }

let state; let st; // the whole run: truth, each side's knowledge, the decisions

function makeWorld() {
  const w = { families: [], people: {}, pid: 0 };
  // Compounds around the village centre, a few outlying.
  const pos = [];
  let tries = 0;
  while (pos.length < tune.families && tries++ < 4000) {
    const out = pos.length >= tune.families - 3;
    const r = out ? 480 + rng() * 260 : 60 + rng() * 380, a = rng() * Math.PI * 2;
    const p = { x: Math.round(VCTR.x + Math.cos(a) * r * 1.25), y: Math.round(VCTR.y + Math.sin(a) * r * 0.9) };
    if (Math.abs(p.y - 1490) < 30 && p.x > 2200 && p.x < 3200) continue; // keep off the road
    if (dist(p, MOSQUE) < 70) continue;
    if (pos.some(q => dist(p, q) < 95)) continue;
    pos.push(p);
  }
  pos.sort((a, b) => a.x - b.x || a.y - b.y);
  const used = new Set();
  const nm = () => { let n; do n = pick(NAMES); while (used.has(n) && used.size < NAMES.length - 2); used.add(n); return n; };
  pos.forEach((p, i) => {
    const head = nm();
    const f = { cid: i + 1, name: `${head}'s family`, head, pos: p, leaning: 0, fear: 0.12 + rng() * 0.12, causes: [], knows: [], members: [], held: 0 };
    const add = (name, role, fam) => { const id = 'p' + (++w.pid); w.people[id] = { id, name, role, fam: f.cid, status: 'home', history: [] }; f.members.push(id); return id; };
    add('Haji ' + head, 'elder');
    const sons = Math.floor(rng() * 4);
    for (let k = 0; k < sons; k++) add(nm() + ' son of ' + head, 'mam');
    f.dependents = 2 + Math.floor(rng() * 6);
    w.families.push(f);
  });
  const fam = cid => w.families[cid - 1];
  // Leanings: a spread, three families close to the cell, two close to us.
  const g = () => { let u = 0; for (let k = 0; k < 6; k++) u += rng(); return (u - 3) / 1.0; };
  w.families.forEach(f => { f.leaning = clamp(tune.leaningMean + g() * tune.leaningSpread * 0.7, -0.35, 0.35); });
  const far = [...w.families].sort((a, b) => dist(b.pos, COP) - dist(a.pos, COP));
  const cellFams = [far[0], far[2], far[4]];
  cellFams.forEach(f => { f.leaning = -0.45 - rng() * 0.15; });
  const near = [...w.families].filter(f => !cellFams.includes(f)).sort((a, b) => dist(a.pos, COP) - dist(b.pos, COP));
  [near[1], near[4]].forEach(f => { f.leaning = 0.35 + rng() * 0.15; });
  w.families.forEach(f => f.causes.push({ t: -1, d: 0, why: 'standing before the deployment' }));
  // The elder (the malik): the family nearest the mosque.
  const elder = [...w.families].sort((a, b) => dist(a.pos, MOSQUE) - dist(b.pos, MOSQUE))[0];
  elder.isElder = true; elder.leaning = 0.05;
  if (cellFams.includes(elder)) { elder.leaning = -0.1; }
  // The cell: fighters from families that lean its way, the leader an outsider.
  const cell = { money: 3, explosives: tune.explosives, cacheCid: cellFams[1].cid, seized: false, threat: 0, fighters: [], safe: cellFams.map(f => f.cid),
    kb: { pending: [], sight: [], routeUse: { ROAD: [], NORTH: [], SOUTH: [] }, suspects: {}, raided: {} }, spotters: [], tax: null, ied: null, lastBed: null, harassed: {} };
  const cands = [];
  [...w.families].sort((a, b) => a.leaning - b.leaning).forEach(f => f.members.forEach(id => { if (w.people[id].role === 'mam') cands.push(id); }));
  for (const id of cands.slice(0, tune.fighters)) { w.people[id].role = 'fighter'; w.people[id].history.push({ t: -1, what: 'joined the cell before the deployment' }); cell.fighters.push(id); }
  w.cell = cell;
  const lid = 'p' + (++w.pid);
  w.people[lid] = { id: lid, name: 'Qari Zahid', role: 'leader', fam: null, status: 'free', history: [{ t: -1, what: 'came to the valley to lead the cell' }] };
  w.leader = { id: lid, cid: cell.safe[0], state: 'in', pos: { ...fam(cell.safe[0]).pos }, dest: null, destCid: null, movedAt: -999, mosque: 0, escort: cell.fighters.slice(0, 2) };
  // What families already know: the cache, which sons joined.
  w.families.forEach(f => {
    if (dist(f.pos, fam(cell.cacheCid).pos) < tune.neighbourSight && f.cid !== cell.cacheCid && rng() < 0.5) f.knows.push({ kind: 'cache', cid: cell.cacheCid, t: -60 * (5 + rng() * 40), real: true });
    cell.fighters.forEach(id => { const h = fam(w.people[id].fam); if (h !== f && dist(f.pos, h.pos) < tune.neighbourSight && rng() < 0.5) f.knows.push({ kind: 'fighter', cid: h.cid, who: id, t: -60 * (24 + rng() * 100), real: true }); });
    if (dist(f.pos, w.leader.pos) < tune.neighbourSight && rng() < 0.6 && f.cid !== w.leader.cid) f.knows.push({ kind: 'leader', cid: w.leader.cid, t: -60 * (2 + rng() * 20), real: true });
  });
  w.fam = fam;
  return w;
}

function makeCompany() {
  const pls = [
    { id: '1', name: '1st Platoon', pl: 'LT Brandt', trait: 'steady', fatigue: 30, job: 'security' },
    { id: '2', name: '2nd Platoon', pl: 'LT Reyes', trait: 'cautious', fatigue: 18, job: 'cop' },
    { id: '3', name: '3rd Platoon', pl: 'LT Okafor', trait: 'bold', fatigue: 48, job: 'cop' },
  ];
  let k = 0;
  pls.forEach(p => {
    p.soldiers = [];
    for (let i = 0; i < 28; i++) p.soldiers.push({ name: `${pick(RANKS)} ${SURN[(k++ * 7 + 3) % SURN.length]}`, state: 'ok', history: [] });
    p.pos = { ...COP }; p.mission = null; p.lastPos = -999; p.detainees = []; p.notes = []; p.swapAt = null;
  });
  return pls;
}

function reset() {
  seed = Number(params.get('seed')) || CONFIG.seed;
  const world = makeWorld();
  st = { t: 0, acc: 0, speed: 0, score: 0, gained: '', over: null, w: world, pls: makeCompany(), missions: [], mid: 0,
    radio: [], detainees: [], well: null, ccir: { contact: true, casualty: true, target: true, tip: true, backbrief: true, debrief: true, hostile: true, detainee: true },
    hq: { log: [], marks: [], leads: [], notes: {}, pl: {}, dec: [], did: 0, flash: null, stats: { cas: 0, kia: 0, civcas: 0, detained: 0, released: 0, caches: 0 } },
    sel: null, cam: { x: 1950, y: 1460, s: 0.27 }, tab: 'log', form: null, truth: params.get('dev') === '1', battalion: [] };
  state = st;
  gossip(); gossip();
  st.pls.forEach(p => { st.hq.pl[p.id] = { pos: { ...COP }, t: 0 }; });
  hqLog('BN', 'FRAGO 14: Capture Qari ZAHID, cell leader: about 40, beard, walks with a limp in the left leg. Believed to bed down in the village east of COP Kestrel. NLT ' + dtg(tune.deadlineHours * 60) + '. Detain only on positive identification or a hostile act.', 'bn');
  hqLog('XO', 'Sir, 1st Platoon has the outpost. 2nd is rested; 3rd is just back from convoy escort and tired. Suggest a presence patrol into the village and a meeting with the malik (the village elder) to start building the picture.', '');
  events.length = 0;
  rebuildPanel();
}

// =========================================================================================
// THE COMMAND POST'S KNOWLEDGE (st.hq) and the radio
// =========================================================================================
function hqLog(from, txt, cls = '', ccir = null) {
  st.hq.log.unshift({ t: st.t, from, txt, cls });
  if (ccir && st.ccir[ccir]) interrupt(`${from}: ${txt}`);
  panelDirty = true;
}
function interrupt(msg) {
  if (st.speed > 1) st.speed = 1;
  st.hq.flash = { msg, t: st.t };
  alarm();
  events.push({ kind: 'interrupt', msg });
}
function commsOk(p) { // the low wadi north of the road is dead ground to the outpost's radio
  if (lineDist(p, WADI.slice(0, 4)) < 90 && p.y < 1180) return false;
  return true;
}
function radio(pl, txt, opt = {}) { // a message from a platoon: delivered after a delay, held while out of comms
  st.radio.push({ pl: pl.id, from: pl.name.replace(' Platoon', ' PLT'), txt, at: st.t + tune.radioDelay, cls: opt.cls || '', ccir: opt.ccir || null, apply: opt.apply || null, mark: opt.mark || null });
}
function radioTick() {
  for (let i = 0; i < st.radio.length; i++) {
    const m = st.radio[i], pl = st.pls.find(p => p.id === m.pl);
    if (st.t < m.at) continue;
    if (pl && pl.mission && !commsOk(pl.pos)) continue; // held until the platoon has a link
    st.radio.splice(i--, 1);
    if (m.silent) { if (m.apply) m.apply(); continue; }
    radioBlip();
    if (m.mark) st.hq.marks.push({ ...m.mark, t: m.mark.t ?? st.t });
    if (m.apply) m.apply();
    hqLog(m.from, m.txt, m.cls, m.ccir);
  }
}
function decision(title, body, options) {
  const d = { id: ++st.hq.did, title, body, options, t: st.t };
  st.hq.dec.push(d); panelDirty = true; return d;
}
function closeDecision(d) { st.hq.dec = st.hq.dec.filter(x => x !== d); panelDirty = true; }

// =========================================================================================
// THE POPULATION
// =========================================================================================
function lean(f, d, why) {
  if (!d) return;
  f.leaning = clamp(f.leaning + d, -1, 1);
  f.causes.push({ t: st.t, d, why });
}
function familyAt(p, r) { return st.w.families.filter(f => dist(f.pos, p) < r); }
function hasPerson(f, kind, cid) { return f.knows.some(k => k.kind === kind && k.cid === cid && st.t - k.t < 120); }
function share(f) { // what a family is willing to tell a patrol, true or not
  const w = st.w;

      st.acc += rate * dt;
      let n = 0;
      while (st.acc >= 1 && n < 200 && scene === 'play') { st.acc -= 1; simMinute(); n++; }
      if (n) panelDirty = true;
    },
    draw() {
      clear('#0a0e0b'); drawBoard(); drawFlash(); selectedCard();
      if (st.speed === 0) text('PAUSED · Space to resume · 1-4 speed', MAPW / 2, H - 20, 14, '#ffd2a8');
      panel.classList.add('on'); if (panelDirty) rebuildPanel();
    },
  },
  pause: {
    update() { scene = 'play'; st.speed = 0; },
    draw() { scenes.play.draw(); },
  },
  results: {
    update() { if (pressed('Enter') || pressed('KeyR')) { reset(); scene = 'play'; } },
    draw() {
      drawBoard(); panel.classList.remove('on'); form.classList.remove('on');
      ctx.fillStyle = 'rgba(8,12,10,0.94)'; ctx.fillRect(140, 60, 1000, 600); ctx.strokeStyle = '#6c7f70'; ctx.strokeRect(140, 60, 1000, 600);
      text(st.over === 'win' ? 'ZAHID DETAINED' : 'DEADLINE PASSED', W / 2, 105, 40, st.over === 'win' ? '#9fd39a' : '#ec8a80');
      text(st.gained, W / 2, 150, 18, '#e6ecd9');
      const s = st.hq.stats;
      const lines = [`Debrief: what your company learned (${dtg(st.t)})`, `Own casualties ${s.cas} WIA, ${s.kia} KIA · civilian casualties reported ${s.civcas} · detainees ${s.detained} (released ${s.released}) · caches seized ${s.caches}`,
        `Leads on file: ${st.hq.leads.length} · compounds with a debrief: ${Object.keys(st.hq.notes).length} of ${st.w.families.length}`, ...st.battalion.map(b => 'Battalion: ' + b), '', 'Key reports:'];
      const key = st.hq.log.filter(e => e.cls === 'hot').slice(0, 12).reverse();
      lines.forEach((l, i) => text(l, 170, 200 + i * 24, i === 0 ? 17 : 14, i === 0 ? '#e6ecd9' : '#c9d4c2', 'left'));
      key.forEach((e, i) => { const t = `${dtg(e.t)} ${e.from}: ${e.txt}`; text(t.length > 112 ? t.slice(0, 110) + '…' : t, 170, 200 + (lines.length + i) * 22, 13, '#d8c8b0', 'left', "'Courier New', monospace"); });
      text('Enter: take the watch again', W / 2, 635, 18, '#ffffff');
    },
  },
};
// ---- Loop: fixed step, frame time clamped ---------------------------------------------
function step() {
  if (pressed('KeyM')) { setMuted(!muted); hit.delete('KeyM'); }
  scenes[scene].update(STEP); hit.clear();
}
let last, acc = 0, ALPHA = 1; // ALPHA: how far the frame is between the last two steps
function tick() {
  const now = clock.now();
  acc += Math.min(now - last, 0.25); last = now; // a stall never fast-forwards the game
  while (acc >= STEP) { step(); acc -= STEP; }
  ALPHA = acc / STEP; // draw between steps, so the view never judders
  drawFrame();
}
function drawFrame() { scenes[scene].draw(); }
function frame() { tick(); requestAnimationFrame(frame); }
// A headless browser on a time budget runs timers but almost no animation frames: a timer
// ticks when no frame has come for 100 ms on a visible page; a hidden tab stays paused.
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }

// ---- What a check can read and drive (?manual=1 stops the loop; players never see it) ----
window.game = {
  get scene() { return scene; },
  get state() { return state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; }, // the loop steps; a check empties it
  step(n = 1, draw = true, alpha = 1) {
    for (let i = 0; i < n; i++) step();
    if (draw) { ALPHA = alpha; drawFrame(); }
  },
};

reset();
scene = params.get('scene') || 'title';
last = clock.now();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
</script>
